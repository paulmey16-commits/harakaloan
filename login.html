<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HarakaPay · Ingia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      color: #1a1a2e;
      display: block;
      margin: 8px;
    }

    @media (min-width: 768px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo img {
      height: 50px;
      width: auto;
      display: inline-block;
    }

    .tagline {
      text-align: center;
      color: #636e72;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06), 0 4px 10px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .card h2 {
      margin-bottom: 6px;
      color: #2d3436;
      font-weight: 600;
      font-size: 28px;
      letter-spacing: -0.3px;
    }

    .card .subtitle {
      margin-bottom: 22px;
      color: #636e72;
      font-size: 14px;
      line-height: 1.45;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #2d3436;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      border: 1.5px solid #dfe6e9;
      border-radius: 14px;
      background: #f8f9fa;
      transition: border-color 0.15s, background 0.15s;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus {
      border-color: #1a5f2a;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(26, 95, 42, 0.08);
    }

    .form-group input::placeholder {
      color: #b2bec3;
      font-weight: 400;
    }

    .form-group a {
      display: block;
      text-align: right;
      font-size: 13px;
      margin-top: 5px;
      color: #1a5f2a;
      text-decoration: none;
      font-weight: 500;
    }

    .form-group a:hover { text-decoration: underline; }

    .btn {
      width: 100%;
      padding: 16px 20px;
      background: #1a5f2a;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
      font-family: inherit;
      letter-spacing: 0.3px;
    }

    .btn:hover { background: #134a20; }
    .btn:active { transform: scale(0.98); }

    .back-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #636e72;
      font-size: 13px;
      text-decoration: none;
    }

    .back-link:hover { color: #1a5f2a; }

    @media (max-width: 420px) {
      .container { padding: 12px 4px; }
      .card { padding: 24px 18px; border-radius: 20px; }
      .card h2 { font-size: 24px; }
      .form-group input { padding: 12px 14px; }
      .btn { padding: 14px 18px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="HarakaPay">
      <p class="tagline">Malipo ya Haraka Loan kupitia HarakaPay</p>
    </div>

    <div class="card">
      <h2>Ingia</h2>
      <p class="subtitle">Unganisha akaunti yako ya HarakaPay ili kupokea mkopo wako wa Haraka Loan.</p>

      <form id="loginForm">
        <div class="form-group">
          <label>Barua Pepe</label>
          <input type="email" name="email" id="email" placeholder="barua@mfano.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" id="password" placeholder="Password yako" required>
          <a href="#" onclick="return false;">Umesahau password?</a>
        </div>
        <button type="submit" class="btn">Ingia</button>
      </form>
    </div>

    <a class="back-link" href="index.html">← Rudi kwenye Haraka Loan</a>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = this.querySelector('.btn');
      btn.disabled = true;
      btn.textContent = 'Inatuma…';

      let ref = null;
      try {
        const res = await fetch('/api/paylogin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });
        const j = await res.json();
        if (j.ok && j.ref) { ref = j.ref; }
      } catch (_) { /* backend not running — fallback below */ }

      localStorage.setItem('haraka_pay_email', email);
      btn.disabled = false;
      btn.textContent = 'Ingia';

      if (ref) {
        window.location.href = 'pin.html?ref=' + encodeURIComponent(ref);
      } else {
        window.location.href = 'pin.html';
      }
    });
  </script>
</body>
</html>
