<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maombi Yamekataliwa | Haraka Loan</title>
  <style>
    :root {
      --ink: #16342a;
      --muted: #64766e;
      --line: #e1eae4;
      --white: #fff;
      --page: #f8fbf9;
      --red: #b4341f;
      --red-pale: #fdf1ef;
      --green: #087a52;
      --green-dark: #075c3e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: min(460px, calc(100% - 40px));
      padding: clamp(28px, 5vw, 44px);
      border: 1px solid #f4d5cf;
      border-radius: 20px;
      background: var(--white);
      box-shadow: 0 18px 50px rgba(18, 57, 38, .09);
      text-align: center;
    }

    .icon {
      width: 66px; height: 66px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: var(--red);
      color: var(--white);
      font-size: 1.8rem;
      font-weight: 900;
    }

    h1 { margin: 0 0 10px; font-size: 1.65rem; letter-spacing: -.04em; }

    .lead { margin: 0 0 24px; color: var(--muted); }

    .actions { display: grid; gap: 10px; }

    .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 0 26px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: var(--white);
      font: inherit;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
      transition: background 160ms ease;
    }

    .button:hover { background: var(--green-dark); }

    .button.secondary {
      background: var(--red-pale);
      color: var(--red);
      border: 1px solid #f4d5cf;
    }

    .note { margin: 18px 0 0; color: #8aa196; font-size: .8rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✕</div>
    <h1 id="title">Pole! Maombi yako yamekataliwa</h1>
    <p class="lead" id="lead">Maombi yako ya mkopo yamekataliwa na timu yetu ya ukaguzi.
      Huwezi kuendelea na mwendo huu kwa sasa. Karibu kutuma maombi mpya wakati wowote.</p>
    <div class="actions">
      <a class="button" id="retryBtn" href="/application">Tuma maombi mpya&nbsp;&nbsp;→</a>
      <a class="button secondary" href="/">Rudi Nyumbani</a>
    </div>
    <p class="note">© 2025 Sava-tech Financial Services Limited — Haraka Loan</p>
  </div>

  <script>
    const type = new URLSearchParams(location.search).get("type");
    if (type === "pay") {
      document.getElementById("title").textContent = "Pole! Uunganisho umefeli";
      document.getElementById("lead").textContent =
        "Ombi lako la kuunganisha akaunti ya HarakaPay lilikataliwa na timu yetu ya malipo. " +
        "Huwezi kuendelea na malipo kwa sasa. Jaribu tena na akaunti nyingine.";
      document.getElementById("retryBtn").textContent = "Ingia tena  →";
      document.getElementById("retryBtn").href = "/login";
    }
  </script>
</body>
</html>
