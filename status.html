<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inahakikiwa… | Haraka Loan</title>
  <style>
    :root {
      --green: #087a52;
      --green-dark: #075c3e;
      --green-pale: #eaf5ef;
      --ink: #16342a;
      --muted: #64766e;
      --line: #e1eae4;
      --white: #fff;
      --page: #f8fbf9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader {
      display: grid;
      justify-items: center;
      gap: 18px;
      padding: 40px;
      text-align: center;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid var(--green-pale);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader h1 {
      margin: 6px 0 0;
      font-size: 1.3rem;
      letter-spacing: -.03em;
      color: var(--green-dark);
    }

    .loader p { margin: 0; color: var(--muted); font-size: .9rem; }

    .pulse-dots span {
      display: inline-block;
      width: 7px; height: 7px;
      margin: 0 3px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.4s ease infinite;
    }
    .pulse-dots span:nth-child(2) { animation-delay: .2s; }
    .pulse-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h1 id="loaderTitle">Inahakikiwa…</h1>
    <p id="loaderText">Tunasubiri uidhinishaji — tafadhali usifunge ukurasa huu</p>
    <div class="pulse-dots"><span></span><span></span><span></span></div>
  </div>

  <script>
    const ref = new URLSearchParams(location.search).get("ref");

    const isPay = ref && ref.startsWith("HP-");
    const endpoint = isPay ? "/api/pstatus" : "/api/status";

    function go(url) { window.location.replace(url); }

    async function check() {
      if (!ref) { go("/application"); return; }   /* no ref — restart flow */
      try {
        const res = await fetch(endpoint + "?ref=" + encodeURIComponent(ref), { cache: "no-store" });
        if (res.status === 404) { go("/declined?type=loan"); return; }
        if (!res.ok) throw new Error("Server error " + res.status);
        const data = await res.json();
        if (!data.ok) throw new Error("Unexpected response");

        const status = data.status;
        if (status === "approved") { go("/success?ref=" + encodeURIComponent(ref)); return; }
        if (status === "declined") { go("/declined?type=" + (isPay ? "pay" : "loan")); return; }

        /* still pending — keep showing the preloader only */
        setTimeout(check, 2500);
      } catch (e) {
        setTimeout(check, 4000);
      }
    }

    check();
  </script>
</body>
</html>
